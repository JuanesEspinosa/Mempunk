name: Publish to npm

# Se dispara al publicar un GitHub Release (o manualmente desde Actions).
# Usa trusted publishing (OIDC), sin NPM_TOKEN: el publisher se configura en npmjs.com
# con este nombre de archivo, y la provenance se genera sola.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: autentica el publish y genera la provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Trusted publishing exige npm >= 11.5.1; Node 22 trae npm 10.
      - run: npm install -g npm@11
      - run: npm publish --access public
